name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install current npm CLI
        run: npm install --global npm@latest

      - name: Verify release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          package_version="$(node -p "require('./packages/games/package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib
      - run: pnpm -C packages/games test
      - run: pnpm check:docs
      - run: pnpm check:ssr
      - run: pnpm smoke:published

      - name: Publish to npm
        working-directory: packages/games
        run: npm publish --access public
